<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" height="100%">
  <defs>
    <!-- Filtro de resplandor neón verde -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradiente del aro exterior -->
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82f500" />
      <stop offset="100%" stop-color="#5ec900" />
    </linearGradient>

    <!-- Gradiente de la armadura blanca -->
    <linearGradient id="metal-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d9e2ec" />
    </linearGradient>

    <!-- Gradiente oscuro de la carcasa -->
    <linearGradient id="dark-armor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242f3d" />
      <stop offset="100%" stop-color="#0f1722" />
    </linearGradient>
  </defs>

  <!-- ================= AROS NEÓN EXTERIORES ================= -->
  <g fill="none" stroke="url(#green-grad)" stroke-linecap="round">
    <!-- Aro superior -->
    <path d="M 140 240 A 185 185 0 1 1 460 240" stroke-width="13" />
    <!-- Aro inferior izquierdo -->
    <path d="M 215 425 A 185 185 0 0 1 135 325" stroke-width="13" />
    <!-- Aro inferior derecho -->
    <path d="M 385 425 A 185 185 0 0 0 465 325" stroke-width="13" />
  </g>

  <!-- ================= OREJAS ================= -->
  <g>
    <!-- Oreja Izquierda -->
    <circle cx="190" cy="140" r="50" fill="#0f1722" />
    <circle cx="190" cy="140" r="32" fill="#72e000" />
    <!-- Oreja Derecha -->
    <circle cx="410" cy="140" r="50" fill="#0f1722" />
    <circle cx="410" cy="140" r="32" fill="#72e000" />
  </g>

  <!-- ================= CABEZA BASE ================= -->
  <!-- Silueta externa oscura / soporte -->
  <ellipse cx="300" cy="225" rx="145" ry="125" fill="#0f1722" />
  <!-- Placa frontal blanca robot -->
  <ellipse cx="300" cy="235" rx="135" ry="115" fill="url(#metal-white)" />

  <!-- ================= DIADEMA / AURICULARES ================= -->
  <!-- Vincha superior -->
  <path d="M 165 170 Q 300 100 435 170" fill="none" stroke="#0f1722" stroke-width="18" stroke-linecap="round" />
  <!-- Cascos laterales -->
  <rect x="145" y="180" width="36" height="90" rx="18" fill="#72e000" />
  <rect x="160" y="170" width="22" height="110" rx="11" fill="#0f1722" />
  
  <rect x="419" y="180" width="36" height="90" rx="18" fill="#72e000" />
  <rect x="418" y="170" width="22" height="110" rx="11" fill="#0f1722" />

  <!-- ================= PLACAS SUPERIORES DE LA CABEZA ================= -->
  <path d="M 250 115 L 350 115 L 340 165 L 260 165 Z" fill="#334155" />
  <rect x="294" y="115" width="12" height="28" rx="4" fill="#72e000" filter="url(#neon-glow)" />

  <!-- ================= VISOR ROBÓTICO ================= -->
  <!-- Contorno negro del antifaz/visor -->
  <path d="M 175 200 
           Q 220 170 300 200 
           Q 380 170 425 200 
           Q 440 245 420 280 
           Q 370 295 300 270 
           Q 230 295 180 280 
           Q 160 245 175 200 Z" fill="url(#dark-armor)" />

  <!-- Ojos Neón (Líneas curvas de expresión feliz) -->
  <path d="M 225 240 Q 245 220 265 240" fill="none" stroke="#72e000" stroke-width="12" stroke-linecap="round" filter="url(#neon-glow)" />
  <path d="M 335 240 Q 355 220 375 240" fill="none" stroke="#72e000" stroke-width="12" stroke-linecap="round" filter="url(#neon-glow)" />

  <!-- ================= HOCICO ================= -->
  <g>
    <!-- Base blanca redondeada del hocico -->
    <ellipse cx="300" cy="275" rx="60" ry="46" fill="#ffffff" />
    <path d="M 240 275 Q 300 325 360 275" fill="#ffffff" />
    <ellipse cx="300" cy="275" rx="60" ry="46" fill="none" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Nariz mecha -->
    <path d="M 278 256 Q 300 250 322 256 Q 328 274 300 288 Q 272 274 278 256 Z" fill="#0f1722" />
    
    <!-- Sonrisa -->
    <path d="M 300 288 L 300 296" stroke="#0f1722" stroke-width="5" stroke-linecap="round" />
    <path d="M 268 290 Q 284 304 300 296 Q 316 304 332 290" fill="none" stroke="#0f1722" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Micrófono del Headset -->
  <path d="M 430 260 Q 425 330 355 320" fill="none" stroke="#0f1722" stroke-width="8" stroke-linecap="round" />
  <rect x="340" y="311" width="28" height="15" rx="7.5" fill="#72e000" filter="url(#neon-glow)" />

  <!-- Cuerpo y hombros -->
  <path d="M 210 320 Q 185 375 230 425 L 370 425 Q 415 375 390 320 Z" fill="#0f1722" />

  <!-- ================= LAPTOP & ENGRANAJE ================= -->
  <!-- Pantalla de la laptop -->
  <polygon points="215,350 385,350 370,435 230,435" fill="#13222e" stroke="#72e000" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Engranaje en la tapa de la laptop -->
  <g fill="#72e000">
    <circle cx="300" cy="392" r="16" />
    <circle cx="300" cy="392" r="8" fill="#13222e" />
    <!-- Dientes del engranaje -->
    <rect x="295" y="369" width="10" height="46" rx="2" />
    <rect x="295" y="369" width="10" height="46" rx="2" transform="rotate(45 300 392)" />
    <rect x="295" y="369" width="10" height="46" rx="2" transform="rotate(90 300 392)" />
    <rect x="295" y="369" width="10" height="46" rx="2" transform="rotate(135 300 392)" />
  </g>

  <!-- Base del teclado de la laptop -->
  <rect x="200" y="433" width="200" height="15" rx="6" fill="#72e000" />
  <rect x="210" y="435" width="180" height="6" rx="3" fill="#0f1722" />

  <!-- ================= TIPOGRAFÍA "HelpDesk" ================= -->
  <g id="texto-helpdesk">
    <text x="300" y="555" text-anchor="middle" font-family="&#39;Segoe UI&#39;, -apple-system, Roboto, Montserrat, sans-serif" font-weight="900" font-size="76" letter-spacing="-1">
      <tspan fill="#0f1722">Help</tspan><tspan fill="#72e000">Desk</tspan>
    </text>
  </g>
</svg>